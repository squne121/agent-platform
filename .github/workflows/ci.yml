      - run: uv run --locked python3 -I scripts/ci/check_import_closure.py
      - name: manifest-pinned collect counts, 0 skipped / xfailed / deselected-without-reason (fake gh boundary only)
        shell: bash
        run: |
          set -eo pipefail
          uv run --locked python3 -I scripts/ci/run_stage1b1_tests.py docs/dev/stage1b3a-producer-transport-manifest.json | tee runner.out
          if grep -Eiq "(^|[^0-9])[1-9][0-9]* (skipped|xfailed|xpassed)" runner.out; then exit 1; fi
