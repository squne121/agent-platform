      - name: manifest-pinned collect counts, 0 skipped / xfailed, only the listed deferred tests deselected (fake gh / mocks, no real GitHub write)
        shell: bash
        run: |
          set -eo pipefail
          uv run --locked python3 -I scripts/ci/run_stage1b1_tests.py docs/dev/stage2-1c-exec-tests-manifest.json | tee runner.out
          if grep -Eiq "(^|[^0-9])[1-9][0-9]* (skipped|xfailed|xpassed)" runner.out; then exit 1; fi
          grep -Eq "(^|[^0-9])32 deselected" runner.out
          grep -Eq "(^|[^0-9])32 deferred with reasons, 236 ran, 0 skipped" runner.out
  stage2-2-comment-lane:
    runs-on: ubuntu-latest
