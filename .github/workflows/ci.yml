name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked
      - run: uv run --locked pytest -q tests/smoke
  stage0-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked
      - run: uv run --locked python3 -I scripts/ci/check_no_functional_slug.py scripts config tests .github pyproject.toml .claude
      - run: uv run --locked python3 -I scripts/ci/run_stage0_tests.py
  stage1a-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked
      - run: uv run --locked python3 -I scripts/ci/check_import_closure.py
      - run: uv run --locked python3 -I scripts/ci/run_stage1a_tests.py
  stage1a-2-canonical-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked
      - name: real-subprocess canonical preflight chain (fake gh boundary only)
        shell: bash
        run: |
          set -eo pipefail
          uv run --locked pytest -q -rsxX -p no:cacheprovider \
            tests/stage1a/test_stage1a_2_canonical_preflight.py \
            .claude/skills/issue-refinement-loop/scripts/tests/test_workflow_start_entry_canonical_executor.py \
            .claude/skills/issue-refinement-loop/scripts/tests/test_skill_runtime_exec_env_allowlist.py \
            | tee pytest.out
          ! grep -Eiq "[0-9]+ (skipped|xfailed|xpassed|deselected)" pytest.out
  stage1b-1-leaf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked
      - run: uv run --locked python3 -I scripts/ci/check_import_closure.py
      - run: uv run --locked python3 -I scripts/ci/run_stage1b1_tests.py
      - run: uv run --locked python3 -I scripts/ci/run_stage1b1_tests.py docs/dev/stage1b2-contract-checkers-manifest.json
  stage1b-3a-producer-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked
      - run: uv run --locked python3 -I scripts/ci/check_import_closure.py
      - name: manifest-pinned collect counts, 0 skipped / xfailed / deselected-without-reason (fake gh boundary only)
        shell: bash
        run: |
          set -eo pipefail
          uv run --locked python3 -I scripts/ci/run_stage1b1_tests.py docs/dev/stage1b3a-producer-transport-manifest.json | tee runner.out
          if grep -Eiq "(^|[^0-9])[1-9][0-9]* (skipped|xfailed|xpassed)" runner.out; then exit 1; fi
          grep -Eq "[0-9]+ deselected" runner.out
          grep -Eq "1 deferred with reasons, [0-9]+ ran, 0 skipped" runner.out
  stage1b-3b-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked
      - run: uv run --locked python3 -I scripts/ci/check_import_closure.py
      - name: manifest-pinned collect counts, 0 skipped / xfailed / deselected-without-reason (fake gh boundary only)
        shell: bash
        run: |
          set -eo pipefail
          uv run --locked python3 -I scripts/ci/run_stage1b1_tests.py docs/dev/stage1b3b-pipeline-tests-manifest.json | tee runner.out
          if grep -Eiq "(^|[^0-9])[1-9][0-9]* (skipped|xfailed|xpassed)" runner.out; then exit 1; fi
          grep -Eq "[0-9]+ deselected" runner.out
          grep -Eq "2 deferred with reasons, [0-9]+ ran, 0 skipped" runner.out
  stage1b-4-semantic-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked
      - run: uv run --locked python3 -I scripts/ci/check_import_closure.py
      - name: manifest-pinned collect counts, 0 skipped / xfailed / deselected (fixture evidence only, no live reviewer)
        shell: bash
        run: |
          set -eo pipefail
          uv run --locked python3 -I scripts/ci/run_stage1b1_tests.py docs/dev/stage1b4-semantic-review-manifest.json | tee runner.out
          if grep -Eiq "(^|[^0-9])[1-9][0-9]* (skipped|xfailed|xpassed|deselected)" runner.out; then exit 1; fi
          grep -Eq "(^|[^0-9])0 deferred with reasons, [0-9]+ ran, 0 skipped" runner.out
  stage2-1a-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked
      - run: uv run --locked python3 -I scripts/ci/check_import_closure.py
      - name: manifest-pinned collect counts, 0 skipped / xfailed / deselected (fixture evidence only, no gh / no GitHub write)
        shell: bash
        run: |
          set -eo pipefail
          uv run --locked python3 -I scripts/ci/run_stage1b1_tests.py docs/dev/stage2-1a-policy-manifest.json | tee runner.out
          if grep -Eiq "(^|[^0-9])[1-9][0-9]* (skipped|xfailed|xpassed|deselected)" runner.out; then exit 1; fi
          grep -Eq "(^|[^0-9])0 deferred with reasons, 141 ran, 0 skipped" runner.out
  stage2-1b-exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked
      - run: uv run --locked python3 -I scripts/ci/check_import_closure.py
      - name: manifest-pinned collect counts, 0 skipped / xfailed / deselected (fake gh / mocks, no real GitHub write)
        shell: bash
        run: |
          set -eo pipefail
          uv run --locked python3 -I scripts/ci/run_stage1b1_tests.py docs/dev/stage2-1b-exec-manifest.json | tee runner.out
          if grep -Eiq "(^|[^0-9])[1-9][0-9]* (skipped|xfailed|xpassed|deselected)" runner.out; then exit 1; fi
          grep -Eq "(^|[^0-9])0 deferred with reasons, 122 ran, 0 skipped" runner.out
  stage2-1c-exec-tests:
