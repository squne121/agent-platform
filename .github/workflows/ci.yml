          grep -Eq "(^|[^0-9])39 deselected" runner.out
          grep -Eq "(^|[^0-9])39 deferred with reasons, 344 ran, 0 skipped" runner.out
  stage2-5-create-txn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked
      - run: uv run --locked python3 -I scripts/ci/check_import_closure.py
      - name: manifest-pinned collect counts, 0 skipped / xfailed, only the listed deferred test deselected (fake gh only, no real GitHub read or write)
        shell: bash
        run: |
          set -eo pipefail
          uv run --locked python3 -I scripts/ci/run_stage1b1_tests.py docs/dev/stage2-5-create-txn-manifest.json | tee runner.out
          if grep -Eiq "(^|[^0-9])[1-9][0-9]* (skipped|xfailed|xpassed)" runner.out; then exit 1; fi
          grep -Eq "(^|[^0-9])1 deselected" runner.out
          grep -Eq "(^|[^0-9])1 deferred with reasons, 305 ran, 0 skipped" runner.out
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_public_hygiene.sh
  stage2-6-materialization:
