      - run: uv sync --locked
      - run: uv run --locked python3 -I scripts/ci/check_import_closure.py
      - name: manifest-pinned collect counts, 0 skipped / xfailed, only the listed deferred tests deselected (fake gh only, no real GitHub read or write)
        shell: bash
        run: |
          set -eo pipefail
          uv run --locked python3 -I scripts/ci/run_stage1b1_tests.py docs/dev/stage2-4-edit-txn-manifest.json | tee runner.out
