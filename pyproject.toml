[project]
name = "agent-platform"
version = "0.1.0"
description = "AI development platform"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.18",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.8,<4", "ruff>=0.6"]

[tool.uv]
required-version = "==0.11.29"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra --strict-markers"
xfail_strict = true

[tool.ruff]
line-length = 100
# Verbatim-migrated sources (see docs/dev/stage1a-core-manifest.json): kept byte-comparable
# with the source tag, so they are not reformatted. New code stays linted.
extend-exclude = [
    ".claude/skills",
    "scripts/agent-ops/allowed_paths_policy.py",
    "scripts/agent-ops/context_budget_report.py",
    "scripts/agent-ops/evidence_index.py",
    # Stage 1b-1 verbatim-migrated sources/tests (docs/dev/stage1b1-leaf-manifest.json).
    "scripts/agent-guards/extension_surface_policy_matcher.py",
    "scripts/agent-guards/changed_file_matcher.py",
    # Stage 1b-4 verbatim extraction (docs/dev/stage1b4-semantic-review-manifest.json).
    "scripts/agent-ops/claude_stream_extractors.py",
    "tests/stage1b/test_changed_file_matcher.py",
    "tests/stage1b/test_extension_surface_policy_matcher.py",
    "tests/stage1b/test_extension_surface_policy_matcher_candidate_perimeter.py",
    "tests/stage1b/test_extension_surface_runtime_policy_schema.py",
]
